<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>File relay</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { max-width: 36rem; margin: 12vh auto; padding: 1.5rem; line-height: 1.6; }
  h1 { letter-spacing: -.04em; margin-bottom: .25rem; }
  form { display: grid; gap: 1rem; margin: 2rem 0; }
  input, button { font: inherit; }
  button { padding: .6rem 1rem; cursor: pointer; }
  a { overflow-wrap: anywhere; }
  progress { width: 100%; }
  code { overflow-wrap: anywhere; }
</style>
<h1>File relay</h1>
<p>Upload a file, get a download link. Up to 200 MB. Files expire after 1 hour. Anyone with the link can download.</p>
<form id="upload">
  <label for="file">Choose a file</label>
  <input type="file" id="file" name="file" required>
  <button id="submit">Upload file</button>
  <progress id="progress" max="100" value="0" hidden aria-label="Upload progress"></progress>
</form>
<div id="result" role="status" aria-live="polite"></div>
<p>From a terminal:<br><code>curl -fsS -F 'file=@test.txt' <span id="endpoint"></span>/upload</code></p>
<script>
  const form = document.querySelector('#upload');
  const input = document.querySelector('#file');
  const button = document.querySelector('#submit');
  const progress = document.querySelector('#progress');
  const result = document.querySelector('#result');
  document.querySelector('#endpoint').textContent = location.origin;
  form.addEventListener('submit', (event) => {
    event.preventDefault();
    if (!input.files.length) return;
    if (input.files[0].size > 200000000) { result.textContent = 'File exceeds the 200 MB limit.'; return; }
    button.disabled = true;
    progress.hidden = false;
    progress.value = 0;
    result.textContent = 'Uploading…';
    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/upload');
    xhr.responseType = 'json';
    xhr.timeout = 30 * 60 * 1000;
    xhr.upload.onprogress = (event) => { if (event.lengthComputable) progress.value = event.loaded / event.total * 100; };
    xhr.onload = () => {
      if (xhr.status !== 201) { result.textContent = xhr.response?.error || `Upload failed (${xhr.status}).`; return; }
      const link = document.createElement('a');
      link.href = xhr.response.url;
      link.textContent = xhr.response.url;
      const expiry = document.createElement('p');
      expiry.textContent = 'Expires ' + new Date(xhr.response.expires_at).toLocaleString();
      result.replaceChildren(link, expiry);
    };
    xhr.onerror = () => { result.textContent = 'Upload failed. Check your connection and try again.'; };
    xhr.ontimeout = () => { result.textContent = 'Upload timed out. Try again.'; };
    xhr.onloadend = () => { button.disabled = false; progress.hidden = true; };
    xhr.send(new FormData(form));
  });
</script>
</html>
