<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>{{.Filename}} · File relay</title>
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/assets/styles/download.css" />
  </head>
  <body>
    <header class="topbar"><nav class="nav" aria-label="Main navigation">
      <a class="brand" href="/"><span class="mark" aria-hidden="true">↗</span>file relay</a>
      <span class="nav-note">Temporary by design</span>
    </nav></header>
    <main class="shell">
      <section aria-label="Video player">
        <h1 class="download-filename">{{.Filename}}</h1>
        <video class="video-player" controls playsinline preload="metadata" src="{{.StreamURL}}" aria-label="{{.Filename}}">
          Your browser cannot play this video. Use the download link below.
        </video>
        <div class="video-actions">
          <a class="button download-button" href="{{.DownloadURL}}" download="{{.Filename}}">Download file ↓</a>
          <div class="video-expiry" data-remaining-ms="{{.RemainingMS}}">
            <span class="video-countdown" role="timer" aria-label="Time remaining">{{.Remaining}}</span>
            <span class="video-until">Available until <time datetime="{{.ExpiresISO}}">{{.ExpiresAt}}</time></span>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="/assets/video.js"></script>
  </body>
</html>
